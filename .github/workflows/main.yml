name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build APK
      run: |
        cd fdownloader
        # İhtiyaç duyulan boş ortam dosyalarını garantiye alıyoruz
        touch .env.example .env
        mkdir -p app
        touch app/.env.example app/.env
        
        # Hazır kurulu Android SDK yolunu verip derliyoruz
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fdownloader-apk
        path: fdownloader/app/build/outputs/apk/debug/app-debug.apk
